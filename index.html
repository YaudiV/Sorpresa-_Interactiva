<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorpresa Interactiva de Aniversario</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Google Fonts Nunito & Dancing Script -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(-45deg, #1f0c22, #3a0e36, #5c1348, #1e0826);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            overflow-x: hidden;
        }

        .font-handwriting {
            font-family: 'Dancing Script', cursive;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Animación de palpitación flotante */
        .heart-idle {
            animation: heartPulse 2s ease-in-out infinite;
        }

        @keyframes heartPulse {
            0%, 100% { transform: scale(var(--current-scale, 1)); }
            50% { transform: scale(calc(var(--current-scale, 1) * 1.05)); }
        }

        .elastic-heart {
            transition: transform 0.4s cubic-bezier(0.34, 1.75, 0.64, 1), filter 0.3s ease;
        }

        .elastic-heart:active {
            transform: scale(calc(var(--current-scale, 1) * 0.92)) !important;
        }

        /* Frases de aniversario flotantes sobre el corazón */
        .floating-message-particle {
            position: absolute;
            pointer-events: none;
            white-space: nowrap;
            animation: floatUpFadeMsg 2s cubic-bezier(0.215, 0.61, 0.355, 1) forwards;
            z-index: 40;
        }

        @keyframes floatUpFadeMsg {
            0% {
                opacity: 0;
                transform: translate(-50%, 0) scale(0.7);
            }
            15% {
                opacity: 1;
                transform: translate(-50%, -20px) scale(1);
            }
            80% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translate(calc(-50% + var(--dx)), -110px) scale(1.05);
            }
        }

        /* Brillo de luz en la barra de progreso */
        .shimmer-bar {
            position: relative;
            overflow: hidden;
        }
        .shimmer-bar::after {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            transform: translateX(-100%);
            background-image: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0,
                rgba(255, 255, 255, 0.4) 30%,
                rgba(255, 255, 255, 0.8) 60%,
                rgba(255, 255, 255, 0)
            );
            animation: shimmer 2s infinite;
            content: '';
        }

        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }

        /* Entrada de la tarjeta final sorpresa */
        .surprise-entry {
            animation: surpriseIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes surpriseIn {
            0% { opacity: 0; transform: scale(0.6) translateY(50px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .heart-explode {
            animation: heartBurstOut 0.6s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards;
        }

        @keyframes heartBurstOut {
            0% { transform: scale(calc(var(--current-scale, 1) * 1.2)); opacity: 1; }
            50% { transform: scale(calc(var(--current-scale, 1) * 1.6)); opacity: 0.8; filter: drop-shadow(0 0 40px #f43f5e); }
            100% { transform: scale(0); opacity: 0; }
        }

        /* Estilos del Sobre Animado */
        .envelope-wrapper {
            perspective: 1000px;
        }
        .envelope {
            position: relative;
            width: 100%;
            height: 180px;
            background-color: #f33a63;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .envelope:hover {
            transform: translateY(-5px);
        }
        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 170px solid transparent;
            border-right: 170px solid transparent;
            border-top: 110px solid #e11d48;
            transform-origin: top;
            transition: transform 0.6s ease-in-out, z-index 0.6s ease;
            z-index: 3;
        }
        @media (min-width: 640px) {
            .envelope-flap {
                border-left-width: 200px;
                border-right-width: 200px;
                border-top-width: 120px;
            }
        }
        .envelope-pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 170px solid #fb7185;
            border-right: 170px solid #f43f5e;
            border-bottom: 100px solid #e11d48;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            z-index: 2;
        }
        @media (min-width: 640px) {
            .envelope-pocket {
                border-left-width: 200px;
                border-right-width: 200px;
                border-bottom-width: 110px;
            }
        }
        .letter {
            position: absolute;
            bottom: 10px;
            left: 5%;
            width: 90%;
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            color: #333;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease;
            z-index: 1;
            opacity: 0;
            pointer-events: none;
        }

        .envelope.open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 0;
        }

        .envelope.open + .letter-out {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 selection:bg-pink-500 selection:text-white">

    <!-- Reproductor de Música de Fondo -->
    <audio id="bg-music" loop preload="auto">
        <source id="music-source" src="cancion.mp3" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio.
    </audio>

    <!-- Botón flotante para controlar la música -->
    <button id="music-control-btn" onclick="toggleMusic()" class="fixed top-4 right-4 z-50 bg-black/50 hover:bg-black/70 backdrop-blur-md border border-white/20 text-white p-3 rounded-full shadow-lg transition-all duration-300 flex items-center justify-center">
        <span id="music-icon" class="text-xl">🎵</span>
    </button>

    <!-- Luces y destellos decorativos de fondo -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute -top-20 -left-20 w-72 h-72 bg-rose-500/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-20 -right-20 w-80 h-80 bg-purple-600/25 rounded-full blur-3xl"></div>
    </div>

    <!-- Contenedor cristal principal -->
    <main class="relative z-10 w-full max-w-lg bg-white/10 backdrop-blur-2xl border border-white/20 p-6 md:p-8 rounded-3xl shadow-[0_25px_60px_rgba(0,0,0,0.6)] text-center text-white my-8">
        
        <!-- SECCIÓN 1: CORAZÓN E INTERACCIÓN DE CLICS -->
        <section id="game-section" class="transition-all duration-500">
            
            <h1 id="titulo-inicial" class="text-2xl md:text-3xl font-black mb-2 tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-rose-300 via-pink-200 to-amber-200 drop-shadow-sm">
                <!-- Cargado mediante JS -->
            </h1>
            
            <p id="subtitulo-inicial" class="text-sm md:text-base text-rose-100/90 mb-6 font-semibold">
                <!-- Cargado mediante JS -->
            </p>

            <!-- Contenedor del Corazón / Botón -->
            <div id="heart-wrapper" class="relative w-full h-64 md:h-72 flex items-center justify-center mb-6 select-none">
                
                <!-- Resplandor dinámico detrás del corazón -->
                <div id="heart-glow" class="absolute w-44 h-44 bg-rose-500/40 rounded-full blur-2xl transition-all duration-300 pointer-events-none"></div>

                <!-- Corazón Interactivo -->
                <div 
                    id="interactive-heart" 
                    class="relative z-10 cursor-pointer elastic-heart heart-idle flex items-center justify-center"
                    style="--current-scale: 1;"
                >
                    <svg 
                        id="svg-heart-icon" 
                        class="w-36 h-36 md:w-44 md:h-44 filter drop-shadow-[0_10px_25px_rgba(244,63,94,0.6)] transition-all duration-300 hover:drop-shadow-[0_15px_35px_rgba(244,63,94,0.9)]" 
                        viewBox="0 0 24 24" 
                        fill="none" 
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <defs>
                            <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#ff4b72" />
                                <stop offset="50%" stop-color="#f43f5e" />
                                <stop offset="100%" stop-color="#9f1239" />
                            </linearGradient>
                        </defs>
                        <path 
                            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" 
                            fill="url(#heartGradient)"
                            stroke="rgba(255,255,255,0.4)"
                            stroke-width="0.5"
                        />
                    </svg>

                    <img 
                        id="custom-heart-img" 
                        src="" 
                        alt="Botón Corazón" 
                        class="hidden w-36 h-36 md:w-44 md:h-44 object-cover rounded-full shadow-2xl border-4 border-white/40"
                        draggable="false"
                    />
                </div>

            </div>

            <!-- Barra de Progreso -->
            <div class="space-y-2 max-w-xs mx-auto">
                <div class="flex justify-between items-center text-xs font-bold text-rose-200 px-1">
                    <span id="etiqueta-progreso"><!-- Cargado JS --></span>
                    <span id="percentage-text" class="text-sm font-black text-rose-300">0%</span>
                </div>

                <div class="w-full bg-black/40 border border-white/15 rounded-full h-5 p-1 backdrop-blur-md shadow-inner relative overflow-hidden">
                    <div 
                        id="progress-fill" 
                        class="h-full bg-gradient-to-r from-rose-500 via-pink-500 to-amber-300 rounded-full transition-all duration-300 ease-out shimmer-bar shadow-[0_0_15px_rgba(244,63,94,0.8)]"
                        style="width: 0%"
                    ></div>
                </div>
            </div>

        </section>

        <!-- SECCIÓN 2: MOSTRAR SORPRESA FINAL -->
        <section id="surprise-section" class="hidden opacity-0 space-y-8">
            <div class="inline-block px-4 py-1 bg-rose-500/30 border border-rose-400/40 rounded-full text-rose-200 font-black text-xs tracking-widest uppercase shadow-lg">
                ✨ ¡Feliz Aniversario! ✨
            </div>

            <h2 id="titulo-sorpresa" class="text-2xl md:text-3xl font-black text-white drop-shadow-[0_2px_12px_rgba(244,63,94,0.6)]">
                <!-- Cargado JS -->
            </h2>

            <!-- FOTO PRINCIPAL TIPO POLAROID -->
            <div class="bg-white p-4 pb-8 rounded-sm shadow-2xl transform -rotate-1 hover:rotate-0 transition-transform duration-300 max-w-sm mx-auto">
                <div class="relative overflow-hidden bg-gray-100 aspect-square">
                    <img 
                        id="surprise-image" 
                        src="" 
                        alt="Fotografía Principal" 
                        class="w-full h-full object-cover"
                        onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=600&auto=format&fit=crop';"
                    >
                </div>
                <p id="polaroid-caption" class="text-gray-800 font-handwriting text-2xl mt-4 font-bold">Un día inolvidable juntos ❤️</p>
            </div>

            <!-- SOBRE DE CARTA INTERACTIVO -->
            <div class="pt-4">
                <p class="text-sm text-rose-200 mb-3 font-semibold animate-pulse">👇 Toca el sobre para abrir nuestra carta de aniversario</p>
                <div class="envelope-wrapper max-w-xs sm:max-w-sm mx-auto">
                    <div id="envelope-element" class="envelope flex items-center justify-center" onclick="openEnvelope()">
                        <div class="envelope-flap"></div>
                        <div class="envelope-pocket"></div>
                        <span class="z-10 text-white font-bold text-sm bg-rose-700/60 px-3 py-1 rounded-full border border-white/30">📩 Abrir Carta</span>
                    </div>
                </div>

                <!-- CONTENIDO DE LA CARTA (Aparece al abrir) -->
                <div id="letter-content" class="hidden mt-6 bg-amber-50/95 text-slate-800 p-6 rounded-2xl shadow-2xl border-2 border-amber-200 text-left transition-all duration-700">
                    <div class="border-b border-amber-200/80 pb-3 mb-4 flex items-center justify-between">
                        <span class="font-handwriting text-2xl text-rose-600 font-bold">Para el amor de mi vida...</span>
                        <span class="text-xl">🥂✨</span>
                    </div>
                    <p id="mensaje-final" class="text-sm md:text-base leading-relaxed text-slate-700 font-medium whitespace-pre-line">
                        <!-- Cargado JS -->
                    </p>
                </div>
            </div>

            <!-- GALERÍA DE 3 FOTOS ADICIONALES -->
            <div class="pt-8 border-t border-white/10">
                <h3 class="text-lg font-bold text-rose-200 mb-6 flex items-center justify-center gap-2">
                    📸 <span>Nuestra Historia en Fotos</span> 📸
                </h3>

                <div class="grid grid-cols-1 gap-6">
                    <div class="bg-white p-3 pb-6 rounded-sm shadow-xl transform rotate-2 hover:rotate-0 transition-transform duration-300">
                        <img id="galeria-foto-1" class="w-full h-56 object-cover rounded-sm" src="" alt="Recuerdo 1">
                    </div>
                    <div class="bg-white p-3 pb-6 rounded-sm shadow-xl transform -rotate-2 hover:rotate-0 transition-transform duration-300">
                        <img id="galeria-foto-2" class="w-full h-56 object-cover rounded-sm" src="" alt="Recuerdo 2">
                    </div>
                    <div class="bg-white p-3 pb-6 rounded-sm shadow-xl transform rotate-1 hover:rotate-0 transition-transform duration-300">
                        <img id="galeria-foto-3" class="w-full h-56 object-cover rounded-sm" src="" alt="Recuerdo 3">
                    </div>
                </div>
            </div>

            <!-- BOTÓN REINICIAR -->
            <div class="pt-6">
                <button 
                    id="btn-reiniciar"
                    onclick="resetGame()" 
                    class="w-full py-3.5 px-6 bg-gradient-to-r from-rose-500 via-pink-600 to-purple-600 hover:from-rose-600 hover:to-purple-700 text-white font-extrabold rounded-xl shadow-lg hover:shadow-rose-500/30 transition-all duration-300 transform active:scale-95"
                >
                    <!-- Cargado JS -->
                </button>
            </div>
        </section>

    </main>

    <script>
        /*
        ================================================================================
        ⚙️ PANEL DE CONFIGURACIÓN - PERSONALIZA TU PÁGINA AQUÍ
        ================================================================================
        */

        const CONFIGURACION = {
            // --- 1. MÚSICA DE FONDO ---
            MUSICA_URL: "Musica.mp3", 

            // --- 2. CONFIGURACIÓN DE CLICS Y CRECIMIENTO ---
            TOTAL_CLICKS: 12,           
            FACTOR_CRECIMIENTO: 0.75,   

            // --- 3. FRASES DE ANIVERSARIO QUE APARECEN EN CADA CLIC ---
            FRASES_ANIVERSARIO: [
                "👩‍❤️‍👨 ¡Feliz Aniversario, mi amor!",
                "✨ Gracias por cada día a tu lado",
                "❤️ Eres lo mejor de mi vida",
                "💖 ¡Por muchísimos años más juntos!",
                "🌹 Cada segundo contigo vale la pena",
                "🥂 Celebrando nuestro gran amor",
                "✨ Mi lugar favorito siempre es a tu lado",
                "🥰 Me vuelves a enamorar cada día",
                "💑 Nuestra historia es mi favorita",
                "💫 Contigo la vida es más bella",
                "❤️ Te quiero con todo mi corazón",
                "🎊 ¡Casi listo nuestro recuerdo!"
            ],

            // --- 4. IMÁGENES ---
            USAR_IMAGEN_EN_VEZ_DE_SVG: false, 
            BOTON_IMAGEN_URL: "mi_corazon.png", 

            // Imagen Principal dentro del recuadro tipo Fotografía (Polaroid):
            SORPRESA_IMAGEN_URL: "Foto1.jpg", 

            // 3 Fotos para la galería que aparece al bajar:
            GALERIA_FOTO_1: "Foto2.jpg",
            GALERIA_FOTO_2: "Foto3.jpg",
            GALERIA_FOTO_3: "Foto4.jpg",

            // --- 5. TEXTOS Y MENSAJES ---
            TITULO_INICIAL: "¡Feliz Aniversario, Mi Amor!",
            SUBTITULO_INICIAL: "Toca el corazón repetidamente para llenar nuestra historia de amor ❤️",
            ETIQUETA_PROGRESO: "Construyendo recuerdos...",

            TITULO_SORPRESA: "👩‍❤️‍👨 ¡Feliz Aniversario! 👩‍❤️‍👨",
            TEXTO_POLAROID: "Siempre juntos ❤️",
            
            // Mensaje emotivo de la carta de aniversario:
            MENSAJE_FINAL: "Hoy celebramos otro mes recorriendo este camino juntos.\n\nMirar atrás y ver todo lo que hemos construido, las risas compartidas, las metas alcanzadas y los momentos en los que nos hemos apoyado me demuestra que elegí al amor de mi vida. Gracias por tu ternura, por tu comprensión y por hacerme feliz cada día.\n\nEste es solo un capítulo más de la hermosa historia que seguiremos escribiendo. ¡Te quiero con toda mi alma! Happy Anniversary! 🥂💖✨",
            
            TEXTO_BOTON_REINICIAR: "🔄 Volver a revivir"
        };

        // --- ESTADO DE LA APLICACIÓN ---
        let currentClicks = 0;
        let isCompleted = false;
        let isMusicPlaying = false;

        // Elementos DOM
        const heartElement = document.getElementById('interactive-heart');
        const heartWrapper = document.getElementById('heart-wrapper');
        const heartGlow = document.getElementById('heart-glow');
        const svgHeartIcon = document.getElementById('svg-heart-icon');
        const customHeartImg = document.getElementById('custom-heart-img');
        const progressFill = document.getElementById('progress-fill');
        const percentageText = document.getElementById('percentage-text');
        const gameSection = document.getElementById('game-section');
        const surpriseSection = document.getElementById('surprise-section');
        const surpriseImg = document.getElementById('surprise-image');
        const bgMusic = document.getElementById('bg-music');
        const musicSource = document.getElementById('music-source');
        const musicIcon = document.getElementById('music-icon');

        // Carga inicial de textos y elementos
        function initApp() {
            document.getElementById('titulo-inicial').innerText = CONFIGURACION.TITULO_INICIAL;
            document.getElementById('subtitulo-inicial').innerText = CONFIGURACION.SUBTITULO_INICIAL;
            document.getElementById('etiqueta-progreso').innerText = CONFIGURACION.ETIQUETA_PROGRESO;
            document.getElementById('titulo-sorpresa').innerText = CONFIGURACION.TITULO_SORPRESA;
            document.getElementById('mensaje-final').innerText = CONFIGURACION.MENSAJE_FINAL;
            document.getElementById('btn-reiniciar').innerText = CONFIGURACION.TEXTO_BOTON_REINICIAR;
            document.getElementById('polaroid-caption').innerText = CONFIGURACION.TEXTO_POLAROID;

            surpriseImg.src = CONFIGURACION.SORPRESA_IMAGEN_URL;
            musicSource.src = CONFIGURACION.MUSICA_URL;
            bgMusic.load();

            // Configurar Fotos Adicionales
            const fallbackImg = 'https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=600&auto=format&fit=crop';
            document.getElementById('galeria-foto-1').src = CONFIGURACION.GALERIA_FOTO_1;
            document.getElementById('galeria-foto-2').src = CONFIGURACION.GALERIA_FOTO_2;
            document.getElementById('galeria-foto-3').src = CONFIGURACION.GALERIA_FOTO_3;

            document.querySelectorAll('#surprise-section img').forEach(img => {
                img.onerror = function() {
                    this.onerror = null;
                    this.src = fallbackImg;
                };
            });

            if (CONFIGURACION.USAR_IMAGEN_EN_VEZ_DE_SVG) {
                svgHeartIcon.classList.add('hidden');
                customHeartImg.classList.remove('hidden');
                customHeartImg.src = CONFIGURACION.BOTON_IMAGEN_URL;
            }
        }

        initApp();

        // Control de Música
        function toggleMusic() {
            if (isMusicPlaying) {
                bgMusic.pause();
                musicIcon.innerText = "🔇";
                isMusicPlaying = false;
            } else {
                bgMusic.play().then(() => {
                    musicIcon.innerText = "🎵";
                    isMusicPlaying = true;
                }).catch(err => console.log("Error al reproducir audio:", err));
            }
        }

        function startMusicAuto() {
            if (!isMusicPlaying) {
                bgMusic.play().then(() => {
                    isMusicPlaying = true;
                    musicIcon.innerText = "🎵";
                }).catch(err => {
                    console.log("Autoplay bloqueado por el navegador.");
                });
            }
        }

        // Clic en el corazón
        heartElement.addEventListener('click', function(e) {
            if (isCompleted) return;

            startMusicAuto();

            currentClicks++;

            const progressRatio = Math.min(currentClicks / CONFIGURACION.TOTAL_CLICKS, 1);
            const percentage = Math.round(progressRatio * 100);
            const newScale = 1 + (progressRatio * CONFIGURACION.FACTOR_CRECIMIENTO);
            
            heartElement.style.setProperty('--current-scale', newScale);

            const glowScale = 1 + (progressRatio * 0.8);
            const glowOpacity = 0.4 + (progressRatio * 0.5);
            heartGlow.style.transform = `scale(${glowScale})`;
            heartGlow.style.opacity = glowOpacity;

            progressFill.style.width = percentage + '%';
            percentageText.innerText = percentage + '%';

            // Mostrar frase flotante emergente arriba del corazón
            spawnFloatingMessage(e);

            if (currentClicks >= CONFIGURACION.TOTAL_CLICKS) {
                isCompleted = true;
                setTimeout(triggerCompletion, 350);
            }
        });

        // Frases flotantes emergentes al presionar
        function spawnFloatingMessage(e) {
            const rect = heartWrapper.getBoundingClientRect();
            
            const x = e.clientX ? (e.clientX - rect.left) : (rect.width / 2);
            const y = e.clientY ? (e.clientY - rect.top) : (rect.height / 2);

            const particle = document.createElement('div');
            particle.className = 'floating-message-particle font-black text-amber-200 drop-shadow-[0_2px_8px_rgba(0,0,0,0.8)] text-sm md:text-base select-none';
            
            // Seleccionar frase de aniversario correspondiente
            const fraseIndex = (currentClicks - 1) % CONFIGURACION.FRASES_ANIVERSARIO.length;
            particle.innerText = CONFIGURACION.FRASES_ANIVERSARIO[fraseIndex];

            particle.style.left = `${x}px`;
            particle.style.top = `${y}px`;

            const dx = (Math.random() - 0.5) * 80;
            particle.style.setProperty('--dx', `${dx}px`);

            heartWrapper.appendChild(particle);

            setTimeout(() => {
                particle.remove();
            }, 2000);
        }

        // Abrir Carta
        function openEnvelope() {
            const envelope = document.getElementById('envelope-element');
            const letter = document.getElementById('letter-content');
            
            envelope.classList.add('open');
            
            setTimeout(() => {
                letter.classList.remove('hidden');
                letter.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 400);
        }

        // Revelar sorpresa final
        function triggerCompletion() {
            heartElement.classList.remove('heart-idle');
            heartElement.classList.add('heart-explode');

            lanzarConfeti();

            setTimeout(() => {
                gameSection.classList.add('hidden');

                surpriseSection.classList.remove('hidden');
                surpriseSection.classList.add('surprise-entry');
            }, 500);
        }

        // Confeti
        function lanzarConfeti() {
            const duration = 3 * 1000;
            const animationEnd = Date.now() + duration;

            (function frame() {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) return;

                confetti({
                    particleCount: 4,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#f43f5e', '#ec4899', '#fbbf24', '#ffffff']
                });
                confetti({
                    particleCount: 4,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#f43f5e', '#ec4899', '#fbbf24', '#ffffff']
                });

                requestAnimationFrame(frame);
            }());
        }

        // Reiniciar
        function resetGame() {
            currentClicks = 0;
            isCompleted = false;

            heartElement.style.setProperty('--current-scale', 1);
            heartElement.classList.remove('heart-explode');
            heartElement.classList.add('heart-idle');

            heartGlow.style.transform = 'scale(1)';
            heartGlow.style.opacity = '0.4';

            progressFill.style.width = '0%';
            percentageText.innerText = '0%';

            const envelope = document.getElementById('envelope-element');
            const letter = document.getElementById('letter-content');
            if (envelope) envelope.classList.remove('open');
            if (letter) letter.classList.add('hidden');

            surpriseSection.classList.add('hidden');
            surpriseSection.classList.remove('surprise-entry');

            gameSection.classList.remove('hidden');
        }
    </script>
</body>
</html>
