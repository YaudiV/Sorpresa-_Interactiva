<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorpresa Interactiva de Corazón</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Google Fonts Nunito -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(-45deg, #1f0c22, #3a0e36, #5c1348, #1e0826);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Animación de palpitación flotante cuando está en reposo */
        .heart-idle {
            animation: heartPulse 2s ease-in-out infinite;
        }

        @keyframes heartPulse {
            0%, 100% { transform: scale(var(--current-scale, 1)); }
            50% { transform: scale(calc(var(--current-scale, 1) * 1.05)); }
        }

        /* Transición elástica fluida para el crecimiento */
        .elastic-heart {
            transition: transform 0.4s cubic-bezier(0.34, 1.75, 0.64, 1), filter 0.3s ease;
        }

        /* Efecto al presionar directamente */
        .elastic-heart:active {
            transform: scale(calc(var(--current-scale, 1) * 0.92)) !important;
        }

        /* Partícula flotante de corazón al hacer clic */
        .floating-heart-particle {
            position: absolute;
            pointer-events: none;
            animation: floatUpFade 1.2s cubic-bezier(0.215, 0.61, 0.355, 1) forwards;
            z-index: 30;
        }

        @keyframes floatUpFade {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.6) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translate(calc(-50% + var(--dx)), calc(-50% - 90px)) scale(1.4) rotate(var(--rot));
            }
        }

        /* Brillo de luz en la barra de progreso */
        .shimmer-bar {
            position: relative;
            overflow: hidden;
        }
        .shimmer-bar::after {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            transform: translateX(-100%);
            background-image: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0,
                rgba(255, 255, 255, 0.4) 30%,
                rgba(255, 255, 255, 0.8) 60%,
                rgba(255, 255, 255, 0)
            );
            animation: shimmer 2s infinite;
            content: '';
        }

        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }

        /* Entrada de la tarjeta final sorpresa */
        .surprise-entry {
            animation: surpriseIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes surpriseIn {
            0% { opacity: 0; transform: scale(0.6) translateY(50px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Explosión y desvanecimiento del corazón inicial */
        .heart-explode {
            animation: heartBurstOut 0.6s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards;
        }

        @keyframes heartBurstOut {
            0% { transform: scale(calc(var(--current-scale, 1) * 1.2)); opacity: 1; }
            50% { transform: scale(calc(var(--current-scale, 1) * 1.6)); opacity: 0.8; filter: drop-shadow(0 0 40px #f43f5e); }
            100% { transform: scale(0); opacity: 0; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 selection:bg-pink-500 selection:text-white">

    <!-- Luces y destellos decorativos de fondo -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute -top-20 -left-20 w-72 h-72 bg-rose-500/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-20 -right-20 w-80 h-80 bg-purple-600/25 rounded-full blur-3xl"></div>
    </div>

    <!-- Contenedor cristal principal -->
    <main class="relative z-10 w-full max-w-md bg-white/10 backdrop-blur-2xl border border-white/20 p-6 md:p-8 rounded-3xl shadow-[0_25px_60px_rgba(0,0,0,0.6)] text-center text-white">
        
        <!-- SECCIÓN 1: CORAZÓN E INTERACCIÓN DE CLICS -->
        <section id="game-section" class="transition-all duration-500">
            
            <h1 id="titulo-inicial" class="text-2xl md:text-3xl font-black mb-2 tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-rose-300 via-pink-200 to-amber-200 drop-shadow-sm">
                <!-- Cargado mediante JS -->
            </h1>
            
            <p id="subtitulo-inicial" class="text-sm md:text-base text-rose-100/90 mb-6 font-semibold">
                <!-- Cargado mediante JS -->
            </p>

            <!-- Contenedor del Corazón / Botón -->
            <div id="heart-wrapper" class="relative w-full h-64 md:h-72 flex items-center justify-center mb-6 select-none">
                
                <!-- Resplandor dinamico detrás del corazón -->
                <div id="heart-glow" class="absolute w-44 h-44 bg-rose-500/40 rounded-full blur-2xl transition-all duration-300 pointer-events-none"></div>

                <!-- Corazón Interactivo (SVG por defecto o Imagen) -->
                <div 
                    id="interactive-heart" 
                    class="relative z-10 cursor-pointer elastic-heart heart-idle flex items-center justify-center"
                    style="--current-scale: 1;"
                >
                    <!-- SVG de Corazón estilizado -->
                    <svg 
                        id="svg-heart-icon" 
                        class="w-36 h-36 md:w-44 md:h-44 filter drop-shadow-[0_10px_25px_rgba(244,63,94,0.6)] transition-all duration-300 hover:drop-shadow-[0_15px_35px_rgba(244,63,94,0.9)]" 
                        viewBox="0 0 24 24" 
                        fill="none" 
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <defs>
                            <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#ff4b72" />
                                <stop offset="50%" stop-color="#f43f5e" />
                                <stop offset="100%" stop-color="#9f1239" />
                            </linearGradient>
                        </defs>
                        <path 
                            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" 
                            fill="url(#heartGradient)"
                            stroke="rgba(255,255,255,0.4)"
                            stroke-width="0.5"
                        />
                    </svg>

                    <!-- Imagen alternativa si se activa en la CONFIGURACION -->
                    <img 
                        id="custom-heart-img" 
                        src="" 
                        alt="Botón Corazón" 
                        class="hidden w-36 h-36 md:w-44 md:h-44 object-cover rounded-full shadow-2xl border-4 border-white/40"
                        draggable="false"
                    />
                </div>

            </div>

            <!-- Barra de Progreso -->
            <div class="space-y-2 max-w-xs mx-auto">
                <div class="flex justify-between items-center text-xs font-bold text-rose-200 px-1">
                    <span id="etiqueta-progreso"><!-- Cargado JS --></span>
                    <span id="percentage-text" class="text-sm font-black text-rose-300">0%</span>
                </div>

                <div class="w-full bg-black/40 border border-white/15 rounded-full h-5 p-1 backdrop-blur-md shadow-inner relative overflow-hidden">
                    <div 
                        id="progress-fill" 
                        class="h-full bg-gradient-to-r from-rose-500 via-pink-500 to-amber-300 rounded-full transition-all duration-300 ease-out shimmer-bar shadow-[0_0_15px_rgba(244,63,94,0.8)]"
                        style="width: 0%"
                    ></div>
                </div>
            </div>

        </section>

        <!-- SECCIÓN 2: MOSTRAR SORPRESA FINAL -->
        <section id="surprise-section" class="hidden opacity-0">
            <div class="inline-block px-4 py-1 bg-rose-500/30 border border-rose-400/40 rounded-full text-rose-200 font-black text-xs tracking-widest uppercase mb-3 shadow-lg">
                ✨ ¡Sorpresa Revelada! ✨
            </div>

            <h2 id="titulo-sorpresa" class="text-2xl md:text-3xl font-black text-white mb-4 drop-shadow-[0_2px_12px_rgba(244,63,94,0.6)]">
                <!-- Cargado JS -->
            </h2>

            <div class="relative rounded-2xl overflow-hidden mb-5 shadow-[0_12px_35px_rgba(0,0,0,0.6)] border-2 border-white/30 group">
                <img 
                    id="surprise-image" 
                    src="" 
                    alt="Imagen de Sorpresa Final" 
                    class="w-full h-64 md:h-80 object-cover rounded-2xl transform transition-transform duration-700 hover:scale-105"
                    onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=600&auto=format&fit=crop';"
                >
            </div>

            <p id="mensaje-final" class="text-sm md:text-base text-rose-100 font-bold mb-6 leading-relaxed px-2">
                <!-- Cargado JS -->
            </p>

            <button 
                id="btn-reiniciar"
                onclick="resetGame()" 
                class="w-full py-3.5 px-6 bg-gradient-to-r from-rose-500 via-pink-600 to-purple-600 hover:from-rose-600 hover:to-purple-700 text-white font-extrabold rounded-xl shadow-lg hover:shadow-rose-500/30 transition-all duration-300 transform active:scale-95"
            >
                <!-- Cargado JS -->
            </button>
        </section>

    </main>

    <script>
        /*
        ================================================================================
        ⚙️ PANEL DE CONFIGURACIÓN - PERSONALIZA TU PÁGINA AQUÍ
        ================================================================================
        */

        const CONFIGURACION = {
            // --- 1. CONFIGURACIÓN DE CLICS Y CRECIMIENTO ---
            TOTAL_CLICKS: 12,           // Clics necesarios para llegar al 100%
            FACTOR_CRECIMIENTO: 0.75,   // Cuánto crece el corazón (0.75 significa que al final medirá 75% más)

            // --- 2. IMÁGENES ---
            // Si deseas usar una imagen propia para el botón en lugar del corazón SVG:
            USAR_IMAGEN_EN_VEZ_DE_SVG: false, 
            BOTON_IMAGEN_URL: "mi_corazon.png", // Nombre del archivo local o URL web

            // Imagen final de la sorpresa (puedes poner "mi_foto.jpg" o una URL de internet):
            SORPRESA_IMAGEN_URL: "Mi_imagen.jpg", 

            // --- 3. TEXTOS Y MENSAJES ---
            TITULO_INICIAL: "¡Tengo una sorpresa para ti!",
            SUBTITULO_INICIAL: "Toca el corazón repetidamente para llenarlo de amor ❤️",
            ETIQUETA_PROGRESO: "Amor enviado...",

            TITULO_SORPRESA: "💖 ¡Para Ti Con Mucho Amor! 💖",
            MENSAJE_FINAL: "¡Gracias por existir y llenar mis días de alegría! Espero que esta pequeña sorpresa te saque una hermosa sonrisa. ¡Eres una muy bella persona! ✨",
            TEXTO_BOTON_REINICIAR: "🔄 Volver a intentar"
        };

        // --- ESTADO DE LA APLICACIÓN ---
        let currentClicks = 0;
        let isCompleted = false;

        // Elementos DOM
        const heartElement = document.getElementById('interactive-heart');
        const heartWrapper = document.getElementById('heart-wrapper');
        const heartGlow = document.getElementById('heart-glow');
        const svgHeartIcon = document.getElementById('svg-heart-icon');
        const customHeartImg = document.getElementById('custom-heart-img');
        const progressFill = document.getElementById('progress-fill');
        const percentageText = document.getElementById('percentage-text');
        const gameSection = document.getElementById('game-section');
        const surpriseSection = document.getElementById('surprise-section');
        const surpriseImg = document.getElementById('surprise-image');

        // Carga inicial de textos y elementos
        function initApp() {
            document.getElementById('titulo-inicial').innerText = CONFIGURACION.TITULO_INICIAL;
            document.getElementById('subtitulo-inicial').innerText = CONFIGURACION.SUBTITULO_INICIAL;
            document.getElementById('etiqueta-progreso').innerText = CONFIGURACION.ETIQUETA_PROGRESO;
            document.getElementById('titulo-sorpresa').innerText = CONFIGURACION.TITULO_SORPRESA;
            document.getElementById('mensaje-final').innerText = CONFIGURACION.MENSAJE_FINAL;
            document.getElementById('btn-reiniciar').innerText = CONFIGURACION.TEXTO_BOTON_REINICIAR;

            surpriseImg.src = CONFIGURACION.SORPRESA_IMAGEN_URL;

            // Configurar si se usa SVG o imagen personalizada para el botón
            if (CONFIGURACION.USAR_IMAGEN_EN_VEZ_DE_SVG) {
                svgHeartIcon.classList.add('hidden');
                customHeartImg.classList.remove('hidden');
                customHeartImg.src = CONFIGURACION.BOTON_IMAGEN_URL;
            }
        }

        initApp();

        // Escuchador de clic/toque en el corazón
        heartElement.addEventListener('click', function(e) {
            if (isCompleted) return;

            currentClicks++;

            // Calcular porcentaje (0 a 100)
            const progressRatio = Math.min(currentClicks / CONFIGURACION.TOTAL_CLICKS, 1);
            const percentage = Math.round(progressRatio * 100);

            // Calcular nueva escala elástica progresiva
            const newScale = 1 + (progressRatio * CONFIGURACION.FACTOR_CRECIMIENTO);
            
            // Actualizar la variable CSS de escala
            heartElement.style.setProperty('--current-scale', newScale);

            // Intensificar el resplandor de fondo
            const glowScale = 1 + (progressRatio * 0.8);
            const glowOpacity = 0.4 + (progressRatio * 0.5);
            heartGlow.style.transform = `scale(${glowScale})`;
            heartGlow.style.opacity = glowOpacity;

            // Actualizar barra de progreso
            progressFill.style.width = percentage + '%';
            percentageText.innerText = percentage + '%';

            // Crear partícula de mini-corazón en la posición del clic
            spawnFloatingHeart(e);

            // Comprobar si se alcanzó la meta
            if (currentClicks >= CONFIGURACION.TOTAL_CLICKS) {
                isCompleted = true;
                setTimeout(triggerCompletion, 350);
            }
        });

        // Generador de partículas flotantes de corazones
        function spawnFloatingHeart(e) {
            const rect = heartWrapper.getBoundingClientRect();
            
            // Determinar origen del clic o centro
            const x = e.clientX ? (e.clientX - rect.left) : (rect.width / 2);
            const y = e.clientY ? (e.clientY - rect.top) : (rect.height / 2);

            const particle = document.createElement('div');
            particle.className = 'floating-heart-particle text-rose-300 font-bold select-none';
            particle.innerHTML = '❤️';
            particle.style.left = `${x}px`;
            particle.style.top = `${y}px`;

            // Direcciones aleatorias para esparcir
            const dx = (Math.random() - 0.5) * 120;
            const rot = (Math.random() - 0.5) * 60;
            const size = Math.random() * 1.2 + 0.8;

            particle.style.setProperty('--dx', `${dx}px`);
            particle.style.setProperty('--rot', `${rot}deg`);
            particle.style.fontSize = `${size}rem`;

            heartWrapper.appendChild(particle);

            // Eliminar partícula al terminar la animación
            setTimeout(() => {
                particle.remove();
            }, 1200);
        }

        // Activación de evento final de victoria / revelación
        function triggerCompletion() {
            // Animación de explosión/desvanecimiento del corazón
            heartElement.classList.remove('heart-idle');
            heartElement.classList.add('heart-explode');

            // Lluvia de confeti
            lanzarConfeti();

            setTimeout(() => {
                gameSection.classList.add('hidden');

                surpriseSection.classList.remove('hidden');
                surpriseSection.classList.add('surprise-entry');
            }, 500);
        }

        // Disparo de Confeti deslumbrante
        function lanzarConfeti() {
            const duration = 3 * 1000;
            const animationEnd = Date.now() + duration;

            (function frame() {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) return;

                confetti({
                    particleCount: 4,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#f43f5e', '#ec4899', '#fbbf24', '#ffffff']
                });
                confetti({
                    particleCount: 4,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#f43f5e', '#ec4899', '#fbbf24', '#ffffff']
                });

                requestAnimationFrame(frame);
            }());
        }

        // Reiniciar el estado
        function resetGame() {
            currentClicks = 0;
            isCompleted = false;

            heartElement.style.setProperty('--current-scale', 1);
            heartElement.classList.remove('heart-explode');
            heartElement.classList.add('heart-idle');

            heartGlow.style.transform = 'scale(1)';
            heartGlow.style.opacity = '0.4';

            progressFill.style.width = '0%';
            percentageText.innerText = '0%';

            surpriseSection.classList.add('hidden');
            surpriseSection.classList.remove('surprise-entry');

            gameSection.classList.remove('hidden');
        }
    </script>
</body>
</html>
